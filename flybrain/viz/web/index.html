<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flybrain session viewer</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<header>
  <div class="baslik">
    <strong>flybrain</strong>
    <span id="bilgi" class="soluk">loading recording…</span>
  </div>
  <div class="denetim">
    <button id="oynat" title="Play / pause (space)">▶</button>
    <select id="hiz" title="Playback speed (relative to simulated time)">
      <option value="0.1">0.1×</option>
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <span id="zaman" class="sayi">0.00 s</span>
  </div>
  <div id="zaman-cizgisi">
    <canvas id="isaretler"></canvas>
    <input id="kaydirac" type="range" min="0" max="1000" step="1" value="0" aria-label="Time">
  </div>
</header>

<main>
  <section class="pano" id="pano-sinek">
    <h2>Fly <span class="soluk">click a body part to see the motor neurons driving it</span></h2>
    <canvas id="sinek"></canvas>
    <div id="rozet-tutma" class="rozet" hidden>held by the experimenter</div>
  </section>

  <section class="pano" id="pano-beyin">
    <h2>Nervous system <span class="soluk" id="beyin-not"></span></h2>
    <canvas id="beyin"></canvas>
    <div class="alt">
      <div id="lejant"></div>
      <label class="secim"><input type="checkbox" id="yaklasik" checked> neurons with approximate positions</label>
    </div>
  </section>

  <section class="pano" id="pano-gozler">
    <h2>What the fly sees <span class="soluk">left | right eye</span></h2>
    <video id="gozler" muted playsinline preload="auto"></video>
  </section>

  <section class="pano" id="pano-ekran">
    <h2>Phone</h2>
    <video id="ekran" muted playsinline preload="auto"></video>
  </section>

  <section class="pano" id="pano-kararlar">
    <h2>Decisions <span class="soluk" id="karar-ozet"></span></h2>
    <div id="simdi"></div>
    <ol id="gunluk"></ol>
  </section>

  <section class="pano" id="pano-iz">
    <h2 id="iz-baslik">Trace back</h2>
    <p id="iz-aciklama" class="soluk">Click a decision or a part of the fly.</p>
    <table id="iz-tablo"><tbody></tbody></table>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
